name: sweep
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (GitHub's floor; may run a few min late)
  workflow_dispatch:
concurrency:
  group: data-writes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sweep.py
      - name: commit
        run: |
          git config user.name "sweep-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "sweep $(date -u +%H:%M)"
          git pull --rebase && git push
