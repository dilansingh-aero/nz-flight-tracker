name: sweep
on:
  schedule:
    # GitHub throttles crons hard: '*/5' fired every 60-145 min, and even an
    # hourly kick came every ~100 min, leaving 49-66 min holes between the
    # 55-minute jobs. Kicking every 30 min keeps one run queued behind the
    # concurrency group below, so the next starts as the last finishes and
    # coverage is continuous. Real 5-minute sampling comes from the loop in the
    # step, never from the schedule. The window is deliberately wider than NZ
    # daylight; sweep.py itself skips when it is dark, so the slack is free.
    - cron: '0,30 16-23,0-9 * * *'
  workflow_dispatch:
concurrency:
  group: data-writes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: sweep every 5 min, segment trips as they finish
        run: |
          git config user.name "sweep-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 11); do
            python3 scripts/sweep.py
            # Etc/GMT-12 is UTC+12 - the same fixed NZT sweep.py files raw under
            python3 scripts/segment.py "$(TZ=Etc/GMT-12 date +%F)" --keep-raw
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "sweep $(TZ=Etc/GMT-12 date +%H:%M)"
              git pull --rebase && git push || echo "push deferred to next cycle"
            fi
            if [ "$i" -lt 11 ]; then sleep 300; fi
          done
