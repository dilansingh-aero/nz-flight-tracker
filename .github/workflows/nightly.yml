name: nightly-segment
on:
  schedule:
    - cron: '20 12 * * *'   # 12:20 UTC = 00:20 NZT — segment yesterday's raw into flights
  workflow_dispatch:
concurrency:
  group: data-writes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  segment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/segment.py
      - name: commit
        run: |
          git config user.name "segment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "flights for $(date -u -d yesterday +%F)"
          git pull --rebase && git push
